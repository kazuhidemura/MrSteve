log_beef_aba_randinit:
  task_id: "sequential"
  terminal_specs:
    max_steps: 12000
  sim_specs:
    generate_world_type: specified_biome
    specified_biome: plains
    initial_mobs:
      - name: cow
        quantity: 10
    initial_mob_spawn_range_low: [-20, 5, -20]
    initial_mob_spawn_range_high: [20, 10, 20] 
    tasks:
      - target_item: beef
        initial_inventory:
          mainhand:
            name: diamond_sword
      - target_item: log
      - target_item: beef
        initial_inventory:
          mainhand:
            name: diamond_sword

