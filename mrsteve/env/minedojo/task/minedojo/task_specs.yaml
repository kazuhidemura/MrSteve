log_water_bucket_aba_randinit:
  task_id: "sequential"
  terminal_specs:
    max_steps: 12000
  sim_specs:
    generate_world_type: specified_biome
    specified_biome: plains
    tasks:
      - target_item: water_bucket
        initial_inventory:
          mainhand:
            name: bucket
      - target_item: log
      - target_item: water_bucket
        initial_inventory:
          mainhand:
            name: bucket

